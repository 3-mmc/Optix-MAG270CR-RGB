# Minimal SWD connection to the NUC126NE4AE on the Optix MAG270CR mainboard.
# Pi GPIO 25 -> ICE_CLK, GPIO 24 -> ICE_DAT, GPIO 18 -> nRESET (undriven).
adapter driver linuxgpiod
adapter gpio swclk 25 -chip 0
adapter gpio swdio 24 -chip 0
transport select swd
adapter speed 100
swd newdap chip cpu -expected-id 0
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
